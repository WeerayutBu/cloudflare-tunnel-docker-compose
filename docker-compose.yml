services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      - tunnel_net
    depends_on:
      - nginx

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel_net
    depends_on:
      - frontend
      - backend

  frontend:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - tunnel_net

  backend:
    image: nginx:1.30.4-alpine # Replace with your backend image.
    restart: unless-stopped
    networks:
      - tunnel_net

networks:
  tunnel_net:
    driver: bridge
