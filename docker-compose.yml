services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tunnel_net
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - tunnel_net
    depends_on:
      - frontend
      - backend

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - tunnel_net

  backend:
    image: nginx:alpine          # replace with your backend image
    restart: unless-stopped
    # build:
    #   context: ./backend
    networks:
      - tunnel_net

networks:
  tunnel_net:
    driver: bridge
